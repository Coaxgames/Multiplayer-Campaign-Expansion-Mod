# Settings
setting.multiplayerpause-toasts.name = Show Pause Toasts (Client Setting)
setting.multiplayerpause-toats.description = Shows a notification at the top of the screen when the game is paused or unpaused
setting.multiplayerpause-allowany.name = Allow Non Admins To Pause (Host Setting)
setting.multiplayerpause-allowany.description = Allows all players in the Campaign to pause
setting.multiplayerpause-adminsobeysync.name = Admins Obey Sync Rules (Host Setting)
setting.multiplayerpause-adminsobeysync.description = If enabled, admins must vote with all players before pausing or unpausing.
setting.multiplayerpause-synconpause.name = Sync On Pause (Host Setting)~ Disabled Currently
setting.multiplayerpause-synconpause.description = When hosting, require every connected player, including the host, to vote before pausing.
setting.multiplayerpause-synconunpause.name = Sync On Unpause (Host Setting)~ Disabled Currently
setting.multiplayerpause-synconunpause.description = When hosting, require every connected player, including the host, to vote before unpausing.
category.multiplayerpause.name = Multiplayer Pause
keybind.multiplayerpause_buildassist.name = Toggle Co-op Build Assist
multiplayerpause-buildassist.hint-on = [red][[{0}][] to Toggle On Build Assist
multiplayerpause-buildassist.hint-off = [accent][[{0}][] to Toggle Off Build Assist
multiplayerpause-buildassist.enabled = Build assist enabled
multiplayerpause-buildassist.disabled = Build assist disabled
setting.multiplayerpause-schedulesync.name = Schedule Syncs If Needed
setting.multiplayerpause-schedulesync.description = Will be Removed/Replaced for Pause-locking